name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name PhotoDuplicateFinder --collect-all pillow_heif --icon cat_square_icon.ico gui.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PhotoDuplicateFinder-Windows
          path: dist/PhotoDuplicateFinder.exe